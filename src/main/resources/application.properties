# PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# JPA (Hibernate)
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
#spring.jpa.hibernate.ddl-auto=create
spring.jpa.hibernate.ddl-auto=validate
#spring.jpa.properties.hibernate.hbm2ddl.auto=none
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}

# Flyway
spring.flyway.enabled=true
# red
spring.flyway.baseline-on-migrate=true
#spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true
spring.flyway.driver=org.postgresql.Driver
#spring.flyway.encoding=UTF-8
spring.flyway.baseline-version=0
spring.flyway.clean-on-validation-error=true

#spring.flyway.url=jdbc:postgresql://postgres:5432/articles
spring.flyway.url=${SPRING_DATASOURCE_URL}
spring.flyway.user=${SPRING_DATASOURCE_USERNAME}
spring.flyway.password=${SPRING_DATASOURCE_PASSWORD}
spring.flyway.locations=classpath:/db/migration

# default=200
server.tomcat.max-threads=${SERVER_TOMCAT_MAX_THREADS}