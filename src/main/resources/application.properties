# PostgreSQL
# ????????? ????????? (?? ?????????)
spring.datasource.url=jdbc:postgresql://localhost:5432/articles
# ????????? ??? Docker
#spring.datasource.url=jdbc:postgresql://postgres:5432/articles
spring.datasource.username=admin
spring.datasource.password=secret
#spring.datasource.driver-class-name=org.postgresql.Driver

# JPA (Hibernate)
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=create
#spring.jpa.properties.hibernate.hbm2ddl.auto=none
spring.jpa.show-sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.driver=org.postgresql.Driver
# ????????? ??? Docker
#spring.flyway.url=jdbc:postgresql://postgres:5432/articles
# ????????? ????????? (?? ?????????)
spring.flyway.url=jdbc:postgresql://localhost:5432/articles
spring.flyway.user=admin
spring.flyway.password=secret
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration