# PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# JPA (Hibernate)
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=create
#spring.jpa.properties.hibernate.hbm2ddl.auto=none
# ????? ????????????
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}

# Flyway
spring.flyway.enabled=true
spring.flyway.driver=org.postgresql.Driver

# Docker
#spring.flyway.url=jdbc:postgresql://postgres:5432/articles
spring.flyway.url=${SPRING_DATASOURCE_URL}
spring.flyway.user=${SPRING_DATASOURCE_USERNAME}
spring.flyway.password=${SPRING_DATASOURCE_PASSWORD}
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# ????? ????????????
# ?????????? ??????? default=200
server.tomcat.max-threads=${SERVER_TOMCAT_MAX_THREADS}