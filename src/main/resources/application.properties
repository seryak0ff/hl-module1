# PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# JPA (Hibernate)
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true
spring.flyway.driver=org.postgresql.Driver
spring.flyway.baseline-version=0
spring.flyway.clean-on-validation-error=true

spring.flyway.url=${SPRING_FLYWAY_URL}
spring.flyway.user=${SPRING_DATASOURCE_USERNAME}
spring.flyway.password=${SPRING_DATASOURCE_PASSWORD}
spring.flyway.locations=classpath:/db/migration

# Server Configuration
server.tomcat.max-threads=${SERVER_TOMCAT_MAX_THREADS:200}

# Observability
statistics.observability=${ENABLE_OBSERVABILITY_STATISTICS:true}
observability.intervals=${OBSERVABILITY_INTERVALS:10,30,60}
service.statistic.observability.delay=${STATISTIC_DELAY:30000}

# Kafka
kafka.hosts=${KAFKA_HOSTS:hl22.zil:9094,hl23.zil:9094}
kafka.groupId=${KAFKA_GROUP_ID:seryak0ff-consumer-group}
kafka.topic=${KAFKA_TOPIC:var17}
kafka.concurrency=${KAFKA_CONCURRENCY:2}
spring.kafka.bootstrap-servers=${kafka.hosts}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always