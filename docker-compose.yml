#version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: articles-db
    restart: always
    environment:
      POSTGRES_DB: articles
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"  # Для обеспечения правильной кодировки
    ports:
      - "5432:5432"
    volumes:
      - articles_data:/var/lib/postgresql/data
      - ./src/main/resources/db/migration:/docker-entrypoint-initdb.d  # Подключаем папку с миграциями
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U admin -d articles" ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app-network

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com  # Укажите ваш email
      PGADMIN_DEFAULT_PASSWORD: secret          # Укажите ваш пароль
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - app-network

  app:
    build: .
    container_name: spring-boot-app
#    deploy:
#      resources:
#        limits:
#          cpus: "0.5" # Max CPU - для тестов: 0.5, 1.0, 1.5, 2.0
#          memory: 1G  # Max RAM
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/articles
      SPRING_FLYWAY_URL: jdbc:postgresql://postgres:5432/articles       # Работа приложения в докере
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: secret
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SERVER_TOMCAT_MAX_THREADS: 200        # Количество потоков
      SPRING_JPA_SHOW_SQL: false            # Отключаем SQL-логи Hibernate
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  articles_data:
